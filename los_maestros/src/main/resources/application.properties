# Perfil por defecto: base H2 en memoria, para correr sin instalar nada.
spring.application.name=los_maestros
spring.datasource.url=jdbc:h2:mem:los_maestros;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Santiago
app.cors.allowed-origins=${CORS_ORIGIN:http://localhost:*,http://127.0.0.1:*}
management.endpoints.web.exposure.include=health
