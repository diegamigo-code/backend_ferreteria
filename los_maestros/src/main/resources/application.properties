spring.application.name=los_maestros

# --- Base de datos (MySQL) ---
# Los valores se pueden cambiar con variables de entorno sin tocar este archivo:
#   DB_URL, DB_USER, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/los_maestros?createDatabaseIfNotExist=true&serverTimezone=America/Santiago}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Santiago
