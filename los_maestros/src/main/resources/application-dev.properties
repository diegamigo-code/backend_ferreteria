spring.application.name=los_maestros
spring.datasource.url=jdbc:mysql://${DB_HOST:db}:${DB_PORT:3306}/${DB_NAME:los_maestros}?serverTimezone=America/Santiago
spring.datasource.username=${DB_USER:dev}
spring.datasource.password=${DB_PASSWORD:devpass}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Santiago
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.port=8080
app.cors.allowed-origins=${CORS_ORIGIN:http://localhost:*,http://127.0.0.1:*}
app.jwt.secret=${JWT_SECRET:clave-de-desarrollo-los-maestros-cambiar-en-produccion}
app.jwt.expiracion-minutos=${JWT_EXPIRACION_MINUTOS:60}
app.admin.email=${ADMIN_EMAIL:admin@losmaestros.cl}
app.admin.password=${ADMIN_PASSWORD:admin12345}
management.endpoints.web.exposure.include=health
