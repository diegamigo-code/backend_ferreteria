name: CI

on:
  push:
    branches: [main]
    paths:
      - 'los_maestros/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'los_maestros/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar, probar y empaquetar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: los_maestros

    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Java 21 (Temurin) con caché de Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: los_maestros/pom.xml

      - name: Compilar y ejecutar pruebas (perfil H2 por defecto)
        run: |
          chmod +x mvnw
          ./mvnw -B clean verify

      - name: Armar paquete de despliegue
        run: |
          mkdir -p dist
          cp target/app.jar dist/app.jar
          cp deploy/DEPLOY.md dist/
          (cd dist && sha256sum app.jar > app.jar.sha256)
          echo "Commit: ${GITHUB_SHA}" > dist/BUILD_INFO.txt
          echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> dist/BUILD_INFO.txt
          ls -lh dist

      - name: Publicar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: los-maestros-backend-${{ github.sha }}
          path: los_maestros/dist/
          if-no-files-found: error
          retention-days: 14

      - name: Publicar reportes de pruebas (si fallan)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: los_maestros/target/surefire-reports/
          retention-days: 7
